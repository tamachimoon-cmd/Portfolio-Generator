<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Gere um portfólio estático a partir de JSON ou YAML"><title>Portfolio Generator</title><link rel="stylesheet" href="/styles.css"></head><body><main><header><p class="eyebrow">LAB//ABERTO #008</p><h1>Portfolio <span>Generator</span></h1><p>Transforme JSON ou YAML em um site estático pronto para publicar. Sem cadastro, sem plataforma proprietária, sem chantagem emocional de plano premium.</p></header><section class="workspace"><div class="editor panel"><div class="toolbar"><select id="format"><option value="json">JSON</option><option value="yaml">YAML</option></select><input id="file" type="file" accept=".json,.yaml,.yml,application/json,text/yaml"><button id="sample" class="ghost">Exemplo</button></div><textarea id="config" spellcheck="false"></textarea><div id="status"></div><div class="actions"><button id="preview">Atualizar prévia</button><button id="export">Exportar ZIP</button></div></div><div class="preview panel"><iframe id="frame" title="Prévia do portfólio"></iframe></div></section></main><script type="module" src="/app.js"></script></body></html>
